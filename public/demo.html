<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Captaloxsubs · Consola</title><link rel="stylesheet" href="/style.css"></head>
<body class="demo"><header><h1>Captaloxsubs <span class="brand-badge">Consola</span></h1><a href="/viewer" target="_blank" rel="noopener">Abrir audiencia ↗</a></header>
<div class="demo-toolbar"><button id="a">Sala A</button><button id="b">Sala B</button><button id="both">Ambas salas</button></div>
<div class="demo-layout"><div id="emitters-container" class="emitters-single"><iframe id="frame-a" src="/?session=A&compact=1" title="Control de sala A" allow="microphone"></iframe><iframe id="frame-b" src="/?session=B&compact=1" title="Control de sala B" allow="microphone" hidden></iframe></div><iframe src="/viewer?session=A" title="Subtítulos de la audiencia"></iframe></div>
<script>const a=document.getElementById('frame-a'),b=document.getElementById('frame-b'),c=document.getElementById('emitters-container');for(const mode of ['a','b','both'])document.getElementById(mode).onclick=()=>{a.hidden=mode==='b';b.hidden=mode==='a';c.className=mode==='both'?'emitters-both':'emitters-single';};</script></body></html>
